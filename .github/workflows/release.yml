name: Release

# Pushing a vX.Y.Z tag builds the sdist and wheel from that tag, publishes them to PyPI with
# trusted publishing (OIDC, no API token), and creates the GitHub Release with the tag's
# CHANGELOG section as the notes. A manual run takes an existing tag; if that version is
# already on PyPI, the publish job is skipped and the Release is created with the files
# PyPI already serves.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      on_pypi: ${{ steps.meta.outputs.on_pypi }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([abc]|rc|\.post|\.dev)?[0-9]*$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Read metadata and check PyPI
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os, re, tomllib, urllib.error, urllib.request

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          name, version = project["name"], project["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"::error::tag {tag} does not match pyproject version {version}")
          init = f"src/{name.replace('-', '_')}/__init__.py"
          if os.path.exists(init):
              found = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', open(init).read(), re.M)
              if found and found.group(1) != version:
                  raise SystemExit(f"::error::{init} says {found.group(1)}, pyproject says {version}")
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=30)
              on_pypi = "true"
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              on_pypi = "false"
          print(f"{name} {version}: already on PyPI = {on_pypi}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={name}\nversion={version}\non_pypi={on_pypi}\n")
          PY

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os, re, subprocess

          version = os.environ["VERSION"]
          heading = re.compile(rf"^## \[{re.escape(version)}\]")

          def section(text):
              lines, keep = [], False
              for line in text.splitlines():
                  if line.startswith("## "):
                      if keep:
                          break
                      keep = bool(heading.match(line))
                      continue
                  if keep:
                      lines.append(line)
              return "\n".join(lines).strip()

          # The tag's own CHANGELOG first; tags cut before the CHANGELOG existed fall back
          # to the default branch.
          sources = []
          if os.path.exists("CHANGELOG.md"):
              sources.append(("tag", open("CHANGELOG.md", encoding="utf-8").read()))
          branch = os.environ["DEFAULT_BRANCH"]
          subprocess.run(["git", "fetch", "--quiet", "origin", branch], check=True)
          shown = subprocess.run(["git", "show", "FETCH_HEAD:CHANGELOG.md"], capture_output=True, text=True)
          if shown.returncode == 0:
              sources.append((branch, shown.stdout))
          for origin, text in sources:
              notes = section(text)
              if notes:
                  print(f"release notes from the CHANGELOG on {origin}")
                  open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes + "\n")
                  break
          else:
              raise SystemExit(f"::error::no '## [{version}]' section in CHANGELOG.md")
          PY

      - name: Build sdist and wheel
        if: steps.meta.outputs.on_pypi == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Fetch the files PyPI already serves
        if: steps.meta.outputs.on_pypi == 'true'
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request

          name, version = os.environ["NAME"], os.environ["VERSION"]
          meta = json.load(urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=30))
          os.makedirs("dist", exist_ok=True)
          for f in meta["urls"]:
              data = urllib.request.urlopen(f["url"], timeout=60).read()
              if hashlib.sha256(data).hexdigest() != f["digests"]["sha256"]:
                  raise SystemExit(f"::error::sha256 mismatch for {f['filename']}")
              open(os.path.join("dist", f["filename"]), "wb").write(data)
              print(f"{f['filename']}  sha256 {f['digests']['sha256']}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.on_pypi == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.name }}/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    # Runs after a successful publish, or when publishing was skipped because the version
    # is already on PyPI.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Create or update the Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.build.outputs.tag }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const body = fs.readFileSync("RELEASE_NOTES.md", "utf8");

            // Only the highest vX.Y.Z tag becomes "Latest", so backfilling old tags does not
            // demote the current release.
            const parse = (t) => (t.match(/^v(\d+)\.(\d+)\.(\d+)$/) || []).slice(1).map(Number);
            const newer = (a, b) => a.length === 3 && (b.length !== 3 || a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0;
            const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
            let highest = [];
            for (const t of tags) if (newer(parse(t.name), highest)) highest = parse(t.name);
            const isLatest = parse(tag).join(".") === highest.join(".");

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              ({ data: release } = await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body }));
              core.info(`Updated existing release ${release.html_url}`);
            } catch (err) {
              if (err.status !== 404) throw err;
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `${process.env.NAME} ${process.env.VERSION}`,
                body, make_latest: isLatest ? "true" : "false",
              }));
              core.info(`Created release ${release.html_url}`);
            }

            const existing = new Set(release.assets.map((a) => a.name));
            for (const file of fs.readdirSync("dist")) {
              if (existing.has(file)) continue;
              const data = fs.readFileSync(path.join("dist", file));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: file, data,
                headers: { "content-type": "application/octet-stream", "content-length": data.length },
              });
              core.info(`Attached ${file}`);
            }

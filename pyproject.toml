[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adk-memshield"
version = "0.1.1"
description = "Zero-trust multi-tenant semantic memory for AI agents (Google ADK, MCP) enforced by PostgreSQL pgvector and Row-Level Security (RLS)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Aalishan" }
]
keywords = [
    "google-adk",
    "adk",
    "ai-agents",
    "agent-memory",
    "memory",
    "multi-tenant",
    "data-isolation",
    "row-level-security",
    "rls",
    "postgresql",
    "pgvector",
    "vector-database",
    "ai-security",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-adk>=2.12.0,<3",
    "psycopg[binary,pool]>=3.1.0",
    "fastembed>=0.3.0",
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/aalishan001/adk-memshield"
Repository = "https://github.com/aalishan001/adk-memshield"
Issues = "https://github.com/aalishan001/adk-memshield/issues"
Changelog = "https://github.com/aalishan001/adk-memshield/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Verify OIDC / JWT identity tokens (Firebase Auth, Identity Platform, any JWKS issuer).
jwt = [
    "PyJWT[crypto]>=2.8.0",
]
# Model Context Protocol server: `memshield-mcp` (stdio or streamable HTTP).
mcp = [
    "mcp>=2.3,<3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "PyJWT[crypto]>=2.8.0",
    "mcp>=2.3,<3",
]

[project.scripts]
memshield-mcp = "adk_memshield.adapters.mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_memshield"]

# Ship the production schema inside the wheel so `pip install` users can apply it.
# The benchmark-only baseline table (sql/02_benchmark_baseline.sql) is deliberately excluded.
[tool.hatch.build.targets.wheel.force-include]
"sql/01_schema.sql" = "adk_memshield/sql/01_schema.sql"
"sql/migrations/0.1_to_0.2.sql" = "adk_memshield/sql/migrations/0.1_to_0.2.sql"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/sql",
    "/tests",
    "/benchmarks",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
